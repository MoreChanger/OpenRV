name: Build OpenRV Windows Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows CY2025 Release
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build OpenRV for Windows
        uses: ./.github/actions/build-windows
        with:
          build-type: Release
          qt-version: 6.5.3
          python-version: 3.11
          cmake-version: 3.31.6
          vfx-platform: CY2025
          msvc-component: 14.40.17.10.x86.x64
          msvc-compiler: 14.40.33807

      - name: Upload OpenRV install tree
        uses: actions/upload-artifact@v4
        with:
          name: OpenRV-Windows-CY2025
          path: _install
          if-no-files-found: error
          retention-days: 14
